<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Full-Stack Python Web App</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; }
    label { display: block; margin-top: 12px; }
    input, textarea { width: 100%; max-width: 400px; padding: 8px; margin-top: 4px; }
    button { margin-top: 12px; padding: 10px 16px; }
    .message { margin-top: 16px; color: #d00; }
    .item { border: 1px solid #ccc; padding: 12px; margin-top: 12px; max-width: 600px; }
  </style>
</head>
<body>
  <h1>Full-Stack Python Web App</h1>
  <p>Use this page to load items from the API and add new items using JavaScript.</p>

  <section>
    <h2>Add a new item</h2>
    <form id="item-form">
      <label>
        Item ID
        <input type="number" id="item-id" required />
      </label>
      <label>
        Item Name
        <input type="text" id="item-name" required />
      </label>
      <label>
        Item Description
        <textarea id="item-description" rows="3"></textarea>
      </label>
      <button type="submit">Create Item</button>
    </form>
    <div id="status" class="message"></div>
  </section>

  <section>
    <h2>Item list</h2>
    <div id="item-list">Loading items...</div>
  </section>

  <script>
    const apiBase = 'http://127.0.0.1:8000';
    const statusEl = document.getElementById('status');
    const itemListEl = document.getElementById('item-list');

    async function loadItems() {
      try {
        const response = await fetch(`${apiBase}/items`);
        if (!response.ok) {
          throw new Error('Unable to load items');
        }
        const items = await response.json();
        if (items.length === 0) {
          itemListEl.textContent = 'No items found. Add one using the form above.';
          return;
        }
        itemListEl.innerHTML = items
          .map(
            (item) => `
              <div class="item">
                <strong>${item.name}</strong>
                <p><strong>ID:</strong> ${item.id}</p>
                <p>${item.description || 'No description provided.'}</p>
              </div>`
          )
          .join('');
      } catch (error) {
        itemListEl.textContent = `Error loading items: ${error.message}`;
      }
    }

    async function createItem(event) {
      event.preventDefault();
      statusEl.textContent = '';
      const id = Number(document.getElementById('item-id').value);
      const name = document.getElementById('item-name').value.trim();
      const description = document.getElementById('item-description').value.trim();

      try {
        const response = await fetch(`${apiBase}/items`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id, name, description }),
        });

        const result = await response.json();
        if (!response.ok) {
          throw new Error(result.detail || 'Failed to create item');
        }

        statusEl.style.color = '#080';
        statusEl.textContent = 'Item created successfully.';
        document.getElementById('item-form').reset();
        loadItems();
      } catch (error) {
        statusEl.style.color = '#d00';
        statusEl.textContent = `Error: ${error.message}`;
      }
    }

    document.getElementById('item-form').addEventListener('submit', createItem);
    window.addEventListener('DOMContentLoaded', loadItems);
  </script>
</body>
</html>
